<!doctype html>
<html class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <title>Mastered Marketing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --accent: #C2683F;        /* MM terracotta */
        --accent-hover: #26201A;  /* MM ink */
        --bg: #F9F4F1;            /* MM warm shell */
        --card: #FFFFFF;
        --text: #26201A;
        --text-muted: #6D6051;
        --border: #E2DCD8;
        --font: Archivo, "Helvetica Neue", Arial, sans-serif;
        --display: "Playfair Display", Georgia, serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #E08A5E; --accent-hover: #C2683F;
          --bg: #191512; --card: #221D19;
          --text: #F3EDE7; --text-muted: #B6A897; --border: #3A312B;
        }
      }
      html, body { height: 100%; }
      body { background-color: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; -webkit-font-smoothing: antialiased; }
      .staticrypt-spinner-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 10; }
      .staticrypt-spinner { width: 2rem; height: 2rem; border: 3px solid var(--border); border-right-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .staticrypt-spinner { animation-duration: 3s; } }
      .staticrypt-content { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 24px; gap: 36px; }
      .logo { display: flex; flex-direction: column; align-items: center; gap: 9px; user-select: none; }
      .logo-word { font-family: var(--display); font-size: 26px; font-weight: 400; letter-spacing: .005em; color: var(--text); }
      .logo-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
      .card { width: 100%; max-width: 410px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 36px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 2px 8px rgba(38,32,26,.06), 0 24px 48px -32px rgba(38,32,26,.28); }
      .card-header { text-align: center; display: flex; flex-direction: column; gap: 7px; }
      .card-label { font-family: var(--display); font-size: 21px; color: var(--text); }
      .card-subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.55; }
      #staticrypt-form { display: flex; flex-direction: column; gap: 15px; }
      .staticrypt-password-container { position: relative; }
      #staticrypt-password { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 15px; padding: 13px 44px 13px 15px; outline: none; transition: border-color .15s; -webkit-appearance: none; }
      #staticrypt-password::placeholder { color: var(--text-muted); opacity: .7; }
      #staticrypt-password:focus { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px rgba(194,104,63,.15); }
      .staticrypt-toggle-password-visibility { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; opacity: .3; cursor: pointer; transition: opacity .15s; }
      .staticrypt-toggle-password-visibility:hover { opacity: .65; }
      .staticrypt-decrypt-button { width: 100%; background: var(--accent); color: #FFF6F1; font-family: var(--font); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border: none; border-radius: 40px; padding: 15px 24px; cursor: pointer; transition: background .15s; -webkit-appearance: none; }
      .staticrypt-decrypt-button:hover { background: var(--accent-hover); }
      .staticrypt-decrypt-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      label.staticrypt-remember { display: flex; align-items: center; gap: 10px; cursor: pointer; }
      .staticrypt-remember input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1.5px solid var(--border); border-radius: 3px; background: transparent; cursor: pointer; position: relative; flex-shrink: 0; transition: border-color .15s, background .15s; }
      .staticrypt-remember input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
      .staticrypt-remember input[type="checkbox"]:checked::after { content: ""; position: absolute; top: 1px; left: 4px; width: 4px; height: 7px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg); }
      .remember-label { font-size: 12.5px; color: var(--text-muted); }
      .footer { font-size: 10.5px; color: var(--text-muted); opacity: .7; letter-spacing: .1em; text-transform: uppercase; }
      .hidden { display: none !important; }
    </style>
  </head>

          <input type="submit" class="staticrypt-decrypt-button" value="View document" />
        </form>
      </div>
      <div class="footer">Mastered Marketing &middot; Confidential</div>
    </div>
    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "That password didn't work. Check the email we sent.",

        templateToggleAltHide = "Hide password",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;
      const templateConfig = { rememberExpirationKey: "staticrypt_expiration", rememberPassphraseKey: "staticrypt_passphrase", replaceHtmlCallback: null, clearLocalStorageCallback: null };
      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);
      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();
          if (isRememberEnabled) { document.getElementById("staticrypt-remember-label").classList.remove("hidden"); }
        }
      };
      const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
      const imgSrcEyeClosed = toggleIcon.src;
      const imgSrcEyeOpened = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48cGF0aCBmaWxsPSIjNkQ2MDUxIiBkPSJNMjg4IDMyYy04MC44IDAtMTQ1LjUgMzYuOC0xOTIuNiA4MC42QzQ4LjYgMTU2IDE3LjMgMjA4IDIuNSAyNDMuN2MtMy4zIDcuOS0zLjMgMTYuNyAwIDI0LjZDMTcuMyAzMDQgNDguNiAzNTYgOTUuNCAzOTkuNEMxNDIuNSA0NDMuMiAyMDcuMiA0ODAgMjg4IDQ4MHMxNDUuNS0zNi44IDE5Mi42LTgwLjZjNDYuOC00My41IDc4LjEtOTUuNCA5My0xMzEuMWMzLjMtNy45IDMuMy0xNi43IDAtMjQuNmMtMTQuOS0zNS43LTQ2LjItODcuNy05My0xMzEuMUM0MzMuNSA2OC44IDM2OC44IDMyIDI4OCAzMnpNMTQ0IDI1NmExNDQgMTQ0IDAgMSAxIDI4OCAwIDE0NCAxNDQgMCAxIDEgLTI4OCAwem0xNDQtNjRjMCAzNS4zLTI4LjcgNjQtNjQgNjRjLTcuMSAwLTEzLjktMS4yLTIwLjMtMy4zYy01LjUtMS44LTExLjkgMS42LTExLjcgNy40Yy4zIDYuOSAxLjMgMTMuOCAzLjIgMjAuN2MxMy43IDUxLjIgNjYuNCA4MS42IDExNy42IDY3LjlzODEuNi02Ni40IDY3LjktMTE3LjZjLTExLjEtNDEuNS00Ny44LTY5LjQtODguNi03MS4xYy01LjgtLjItOS4yIDYuMS03LjQgMTEuN2MyLjEgNi40IDMuMyAxMy4yIDMuMyAyMC4zeiIvPjwvc3ZnPg==";
      toggleIcon.addEventListener("click", function () {
        const passwordInput = document.getElementById("staticrypt-password");
        if (passwordInput.type === "password") { passwordInput.type = "text"; toggleIcon.src = imgSrcEyeOpened; toggleIcon.alt = templateToggleAltHide; toggleIcon.title = templateToggleAltHide; }
        else { passwordInput.type = "password"; toggleIcon.src = imgSrcEyeClosed; toggleIcon.alt = templateToggleAltShow; toggleIcon.title = templateToggleAltShow; }
      });
      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const password = document.getElementById("staticrypt-password").value,
          isRememberChecked = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
        if (!isSuccessful) { alert(templateError); }
      });
    </script>
  </body>
</html>
